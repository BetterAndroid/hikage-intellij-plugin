<p>Reports invalid <code>imeActionId</code> values in Hikage Android attributes.</p>
<p>
    <code>android:imeActionId</code> should not be a resource ID such as <code>@+id/resName</code>. It must be an integer
    constant or an integer resource reference, as defined in <code>EditorInfo</code>.
</p>
