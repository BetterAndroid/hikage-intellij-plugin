<p>Reports potentially overlapping Hikage children in a RelativeLayout.</p>
<p>
    If a relative layout has text or button items aligned to the left and right sides, localized text expansion can
    make them overlap unless they have mutual constraints such as <code>toEndOf</code> and <code>toStartOf</code>.
</p>
