<p>Reports <code>mm</code> or <code>in</code> dimensions in Hikage Android attributes.</p>
<p>
    Avoid using millimeters or inches as dimension units. Many devices do not report their true physical density
    accurately, so the resulting dimensions may be incorrect. Use <code>dp</code>, or <code>sp</code> for font sizes.
