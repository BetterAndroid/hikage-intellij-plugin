<p>
    Reports <code>Hikagable</code> declarations whose names do not start with an uppercase letter.
</p>
<p>
    <code>Hikagable</code> functions and properties whose type is <code>Hikage</code> or <code>Hikage.Delegate</code> are expected to use PascalCase
    names.
</p>
<pre><code>
@Hikagable
fun MyView() {
    // ...
}

val MyView = Hikagable {
    // ...
}
</code></pre>
