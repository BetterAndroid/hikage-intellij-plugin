    Reports Hikage view declarations that cannot generate performer functions.
</p>
<p>
    Classes annotated with <code>@HikageView</code>, and classes referenced by
    <code>@HikageViewDeclaration</code>, must be Android <code>View</code> classes
    with a constructor compatible with <code>(Context, AttributeSet?)</code>.
</p>
