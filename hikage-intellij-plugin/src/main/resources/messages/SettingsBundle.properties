settings.page.name=Hikage
settings.page.description=Configure Hikage IDE support, including completion, highlighting, and XML layout conversion.
settings.group.hikage-dsl=Hikage DSL
settings.group.hikage-dsl.autofill-default-layout-params=Autofill default LayoutParams
settings.group.hikage-dsl.autofill-default-layout-params.help=Automatically adds the default <code>lparams = LayoutParams()</code> argument when completing an eligible Hikagable function call.
settings.group.hikage-dsl.layout-lookup-preview-enabled=Show resolved layout lookup previews
settings.group.hikage-dsl.layout-lookup-preview-enabled.help=Displays resolvable Hikage layout ID and root lookups as compact property-style previews, such as <code>hikage.textView</code>.
settings.group.hikage-attribute=Hikage Attribute
settings.group.hikage-attribute.resource-reference-preview-enabled=Show resolved resource reference previews
settings.group.hikage-attribute.resource-reference-preview-enabled.help=Displays resolvable Hikage attribute resource and theme references as their concrete values, such as <code>@dimen/padding</code> as <code>"10dp"</code>.
settings.group.xml-layout-conversion=XML Layout Conversion
settings.group.xml-layout-conversion.view-option=View Option
settings.group.xml-layout-conversion.view-option.fully-attributes=Fully attributes
settings.group.xml-layout-conversion.view-option.compatible-mode=Compatible mode
settings.group.xml-layout-conversion.view-option.generate-constructor-only=Generate constructor only
settings.group.xml-layout-conversion.view-option.help=<b>Fully attributes</b> keeps every ordinary XML View attribute in <code>attrs</code>. <b>Compatible mode</b> prefers proven constructor writes and keeps the remaining attributes in <code>attrs</code>. <b>Generate constructor only</b> emits only proven constructor writes and preserves the rest as TODOs.
settings.group.xml-layout-conversion.layout-params-option=LayoutParams Option
settings.group.xml-layout-conversion.layout-params-option.fully-attributes=Fully attributes
settings.group.xml-layout-conversion.layout-params-option.compatible-mode=Compatible mode
settings.group.xml-layout-conversion.layout-params-option.layout-params-only=LayoutParams only
settings.group.xml-layout-conversion.layout-params-option.help=<b>Fully attributes</b> keeps every <code>layout_</code> attribute in <code>attrs</code> and omits explicit LayoutParams. <b>Compatible mode</b> prefers an explicit <code>LayoutParams</code> only when the complete attribute group can be converted safely, otherwise it keeps the complete group in <code>attrs</code>. <b>LayoutParams only</b> emits supported explicit values and preserves unsupported values as TODOs.
settings.group.xml-layout-conversion.add-runtime-attribute-dependency=Add "hikage-runtime-attribute" dependency to enable full attribute conversion
settings.group.android-lint=Android Lint
settings.group.android-lint.mirror-enabled=Enable Android lint mirror
settings.group.android-lint.mirror-enabled.help=Runs the applicable Android XML layout lint checks against layouts created from Hikage DSL.