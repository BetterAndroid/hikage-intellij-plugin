settings.page.name=Hikage
settings.page.description=配置 Hikage IDE 支持，包括补全、高亮和 XML 布局转换。
settings.page.setup.hikage-unavailable=当前项目未添加 Hikage。
settings.page.setup.add-hikage-dependency=添加相关依赖
settings.group.hikage-dsl=Hikage DSL
settings.group.hikage-dsl.autofill-default-layout-params=自动填充默认 LayoutParams
settings.group.hikage-dsl.autofill-default-layout-params.help=自动为符合条件的 Hikagable 函数调用补全默认的 <code>lparams = LayoutParams()</code> 参数。
settings.group.hikage-dsl.layout-lookup-preview-enabled=显示已解析的布局查找预览
settings.group.hikage-dsl.layout-lookup-preview-enabled.help=将可解析的 Hikage 布局 ID 和 Root 查找显示为紧凑的属性形式，例如 <code>hikage.textView</code>。
settings.group.hikage-attribute=Hikage Attribute
settings.group.hikage-attribute.resource-reference-preview-enabled=显示已解析的资源引用预览
settings.group.hikage-attribute.resource-reference-preview-enabled.help=将可解析的 Hikage 属性资源和主题引用显示为实际值，例如将 <code>@dimen/padding</code> 显示为 <code>"10dp"</code>。
settings.group.xml-layout-conversion=XML 布局转换
settings.group.xml-layout-conversion.view-option=View 选项
settings.group.xml-layout-conversion.view-option.fully-attributes=完整属性
settings.group.xml-layout-conversion.view-option.compatible-mode=兼容模式
settings.group.xml-layout-conversion.view-option.generate-constructor-only=仅生成构造器
settings.group.xml-layout-conversion.view-option.help=<b>完整属性</b>将所有普通 XML View 属性保留在 <code>attrs</code> 中。<b>兼容模式</b>优先生成已证明安全的构造器写入，其余属性继续保留在 <code>attrs</code> 中。<b>仅生成构造器</b>只生成已证明安全的构造器写入，其余属性保留为 TODO。
settings.group.xml-layout-conversion.layout-params-option=LayoutParams 选项
settings.group.xml-layout-conversion.layout-params-option.fully-attributes=完整属性
settings.group.xml-layout-conversion.layout-params-option.compatible-mode=兼容模式
settings.group.xml-layout-conversion.layout-params-option.layout-params-only=仅 LayoutParams
settings.group.xml-layout-conversion.layout-params-option.help=<b>完整属性</b>将所有 <code>layout_</code> 属性保留在 <code>attrs</code> 中，并且不生成显式 LayoutParams。<b>兼容模式</b>仅在整组属性都能安全转换时优先生成显式 <code>LayoutParams</code>，否则整组保留在 <code>attrs</code> 中。<b>仅 LayoutParams</b>生成受支持的显式值，并将不受支持的值保留为 TODO。
settings.group.xml-layout-conversion.add-runtime-attribute-dependency=添加 “hikage-runtime-attribute” 依赖以启用完整属性转换
settings.group.android-lint=Android Lint
settings.group.android-lint.mirror-enabled=启用 Android Lint 镜像
settings.group.android-lint.mirror-enabled.help=对从 Hikage DSL 创建的布局运行适用的 Android XML 布局 Lint 检查。